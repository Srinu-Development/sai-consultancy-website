<div id="mainImagePreview" class="image-preview-box">

<div id="galleryImagePreview" class="gallery-preview-box">

<script>

/* =====================================================
   SUPABASE CONFIGURATION
   ===================================================== */

const SUPABASE_URL =
    "https://mwjbqedrmwieehlkszmq.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_1ysH560VoBoWH5wzlrhtcw_i2Q6VKBS";

const supabaseClient =
    window.supabase.createClient(

/* =====================================================

let editingPropertyId = null;


/* =====================================================
   ADMIN LOGIN
   ===================================================== */

async function adminLogin() {

    const email =
        document
        .getElementById("adminUsername")
        .value
        .trim();

    const password =
        document
        .getElementById("adminPassword")
        .value;

    const loginMessage =
        document.getElementById("loginMessage");


    if (!email || !password) {

        loginMessage.textContent =
            "Please enter email and password.";

        return;
    }


    loginMessage.textContent =
        "Logging in...";


    const {
        data,
        error
    } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        console.error(error);

        loginMessage.textContent =
            error.message;

        return;
    }


    loginMessage.textContent =
        "Login successful!";

    showDashboard();

}


/* =====================================================
   SHOW DASHBOARD
   ===================================================== */

function showDashboard() {

    document.getElementById(
        "adminLogin"
    ).style.display = "none";


    document.getElementById(
        "adminDashboard"
    ).style.display = "block";


    displayAdminProperties();

}


/* =====================================================
   LOGOUT
   ===================================================== */

async function adminLogout() {

    await supabaseClient.auth.signOut();

    location.reload();

}


/* =====================================================
   CHECK SESSION
   ===================================================== */

async function checkAdminSession() {

    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();


    if (error) {

        console.error(error);

        return;
    }


    if (
        data &&
        data.session
    ) {

        showDashboard();

    }

}


/* =====================================================
   UPLOAD IMAGE
   ===================================================== */

async function uploadPropertyImage(file) {

    if (!file) {

        return null;

    }


    const fileName =
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .substring(2, 10) +
        "-" +
        file.name
            .replace(/\s+/g, "-");


    const filePath =
        fileName;


    const {
        error
    } =
        await supabaseClient
        .storage
        .from("property-images")
        .upload(
            filePath,
            file,
            {
                upsert: false
            }
        );


    if (error) {

        throw error;

    }


    const {
        data
    } =
        supabaseClient
        .storage
        .from("property-images")
        .getPublicUrl(filePath);


    return data.publicUrl;

}


/* =====================================================
   SAVE PROPERTY
   ADD + EDIT
   ===================================================== */

document
.getElementById("propertyForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const saveMessage =
            document.getElementById(
                "propertySaveMessage"
            );


        saveMessage.textContent =
            editingPropertyId
            ? "Updating property..."
            : "Saving property...";


        try {

            /* -----------------------------------------
               FORM VALUES
               ----------------------------------------- */

            const name =
                document
                .getElementById(
                    "adminPropertyName"
                )
                .value
                .trim();


            const location =
                document
                .getElementById(
                    "adminPropertyLocation"
                )
                .value
                .trim();


            const area =
                document
                .getElementById(
                    "adminPropertyArea"
                )
                .value
                .trim();


            const price =
                document
                .getElementById(
                    "adminPropertyPrice"
                )
                .value
                .trim();


            const type =
                document
                .getElementById(
                    "adminPropertyType"
                )
                .value;


            const status =
                document
                .getElementById(
                    "adminPropertyStatus"
                )
                .value;


            const description =
                document
                .getElementById(
                    "adminPropertyDescription"
                )
                .value
                .trim();


            const map =
                document
                .getElementById(
                    "adminPropertyMap"
                )
                .value
                .trim();


            const mainImageFile =
                document
                .getElementById(
                    "adminMainImage"
                )
                .files[0];


            const galleryFiles =
                Array.from(
                    document
                    .getElementById(
                        "adminGalleryImages"
                    )
                    .files
                );


            /* -----------------------------------------
               GET EXISTING PROPERTY WHEN EDITING
               ----------------------------------------- */

            let existingProperty = null;


            if (editingPropertyId) {

                const {
                    data,
                    error
                } =
                    await supabaseClient
                    .from("properties")
                    .select("*")
                    .eq(
                        "id",
                        editingPropertyId
                    )
                    .single();


                if (error) {

                    throw error;

                }


                existingProperty =
                    data;

            }


            /* -----------------------------------------
               MAIN IMAGE
               ----------------------------------------- */

            let mainImage =
                existingProperty
                ? existingProperty.image
                : null;


            if (mainImageFile) {

                mainImage =
                    await uploadPropertyImage(
                        mainImageFile
                    );

            }


            if (
                !mainImage &&
                !editingPropertyId
            ) {

                alert(
                    "Please select a main property image."
                );

                saveMessage.textContent = "";

                return;

            }


            /* -----------------------------------------
               GALLERY
               ----------------------------------------- */

            let gallery =
                existingProperty &&
                Array.isArray(
                    existingProperty.gallery
                )
                ? existingProperty.gallery
                : [];


            if (
                mainImage &&
                gallery.length === 0
            ) {

                gallery = [
                    mainImage
                ];

            }


            /* -----------------------------------------
               NEW GALLERY IMAGES
               ----------------------------------------- */

            for (
                const file of galleryFiles
            ) {

                const imageUrl =
                    await uploadPropertyImage(
                        file
                    );


                if (imageUrl) {

                    gallery.push(
                        imageUrl
                    );

                }

            }


            /* -----------------------------------------
               ADD NEW PROPERTY
               ----------------------------------------- */

            if (!editingPropertyId) {

                const {
                    error
                } =
                    await supabaseClient
                    .from("properties")
                    .insert({

                        name:
                            name,

                        location:
                            location,

                        area:
                            area,

                        price:
                            price,

                        type:
                            type,

                        status:
                            status,

                        description:
                            description,

                        image:
                            mainImage,

                        gallery:
                            gallery,

                        map:
                            map

                    });


                if (error) {

                    throw error;

                }


                saveMessage.textContent =
                    "✅ Property added successfully!";

            }


            /* -----------------------------------------
               UPDATE EXISTING PROPERTY
               ----------------------------------------- */

            else {

                const {
                    error
                } =
                    await supabaseClient
                    .from("properties")
                    .update({

                        name:
                            name,

                        location:
                            location,

                        area:
                            area,

                        price:
                            price,

                        type:
                            type,

                        status:
                            status,

                        description:
                            description,

                        image:
                            mainImage,

                        gallery:
                            gallery,

                        map:
                            map

                    })
                    .eq(
                        "id",
                        editingPropertyId
                    );


                if (error) {

                    throw error;

                }


                saveMessage.textContent =
                    "✅ Property updated successfully!";

            }


            /* -----------------------------------------
               RESET
               ----------------------------------------- */

            editingPropertyId = null;


            document
            .getElementById(
                "propertyForm"
            )
            .reset();


            changeSaveButtonToAdd();


            displayAdminProperties();


        }

        catch (error) {

            console.error(
                "Property save error:",
                error
            );


            saveMessage.textContent =
                "❌ " +
                (
                    error.message ||
                    "Unable to save property."
                );

        }

    }
);


/* =====================================================
   DISPLAY PROPERTIES
   ===================================================== */

async function displayAdminProperties() {

    const container =
        document.getElementById(
            "adminPropertyList"
        );


    if (!container) {

        return;

    }


    container.innerHTML =
        "<p>Loading properties...</p>";


    const {
        data: properties,
        error
    } =
        await supabaseClient
        .from("properties")
        .select("*")
        .order(
            "id",
            {
                ascending: false
            }
        );


    if (error) {

        console.error(error);

        container.innerHTML =
            "<p>❌ Unable to load properties.</p>";

        return;

    }


    if (
        !properties ||
        properties.length === 0
    ) {

        container.innerHTML =
            "<p>No properties added yet.</p>";

        return;

    }


    container.innerHTML = "";


    properties.forEach(
        function(property) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "admin-property-item";


            item.innerHTML = `

                <img
                    src="${property.image || ""}"
                    alt="${property.name}"
                >

                <div>

                    <h4>
                        ${property.name}
                    </h4>

                    <p>
                        📍 ${property.location}
                    </p>

                    <p>
                        📐 ${property.area}
                    </p>

                    <p>
                        💰 ${property.price}
                    </p>

                    <p>
                        🏠 ${property.type}
                    </p>

                    <p>
                        ✅ ${property.status}
                    </p>

                </div>


                <div
                    class="admin-property-actions"
                >

                    <button
                        type="button"
                        onclick="editProperty(${property.id})"
                        class="admin-edit-button"
                    >
                        ✏️ Edit
                    </button>


                    <button
                        type="button"
                        onclick="deleteProperty(${property.id})"
                        class="admin-delete-button"
                    >
                        🗑️ Delete
                    </button>

                </div>

            `;


            container.appendChild(item);

        }
    );

}

   EDIT PROPERTY
   ===================================================== */

        document.getElementById(

        document.getElementById(

/* =====================================================
   DELETE PROPERTY
   ===================================================== */

                        
    /* =====================================================
   GET STORAGE PATH FROM PUBLIC URL
   ===================================================== */

function getStoragePathFromUrl(url) {

    if (!url) {
        return null;
    }

    const marker =
        "/storage/v1/object/public/property-images/";

    const index =
        url.indexOf(marker);

    if (index === -1) {
        return null;
    }

    return decodeURIComponent(
        url.substring(
            index + marker.length
        )
    );
}


/* =====================================================
   DELETE PROPERTY + STORAGE IMAGES
   ===================================================== */

async function deleteProperty(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this property and all its images?"
        );

    if (!confirmed) {
        return;
    }


    try {

        /* -----------------------------------------
           GET PROPERTY
           ----------------------------------------- */

        const {
            data: property,
            error: fetchError
        } =
            await supabaseClient
            .from("properties")
            .select("*")
            .eq("id", id)
            .single();


        if (fetchError) {
            throw fetchError;
        }


        /* -----------------------------------------
           COLLECT IMAGE URLS
           ----------------------------------------- */

        const imagePaths = [];


        /* MAIN IMAGE */

        if (property.image) {

            const mainPath =
                getStoragePathFromUrl(
                    property.image
                );

            if (mainPath) {
                imagePaths.push(mainPath);
            }
        }


        /* GALLERY IMAGES */

        if (
            Array.isArray(property.gallery)
        ) {

            property.gallery.forEach(
                function(imageUrl) {

                    const path =
                        getStoragePathFromUrl(
                            imageUrl
                        );

                    if (
                        path &&
                        !imagePaths.includes(path)
                    ) {

                        imagePaths.push(path);

                    }

                }
            );

        }


        /* -----------------------------------------
           DELETE STORAGE IMAGES
           ----------------------------------------- */

        if (imagePaths.length > 0) {

            const {
                error: storageError
            } =
                await supabaseClient
                .storage
                .from("property-images")
                .remove(
                    imagePaths
                );


            if (storageError) {

                console.warn(
                    "Storage cleanup warning:",
                    storageError
                );

            }

        }


        /* -----------------------------------------
           DELETE DATABASE RECORD
           ----------------------------------------- */

        const {
            error: deleteError
        } =
            await supabaseClient
            .from("properties")
            .delete()
            .eq(
                "id",
                id
            );


        if (deleteError) {
            throw deleteError;
        }


        /* -----------------------------------------
           SUCCESS
           ----------------------------------------- */

        alert(
            "✅ Property and images deleted successfully!"
        );


        displayAdminProperties();

    }

    catch (error) {

        console.error(
            "Delete property error:",
            error
        );


        alert(
            "❌ Unable to delete property.\n\n" +
            (
                error.message ||
                "Unknown error"
            )
        );

    }

}

/* =====================================================
   STEP 20.11.2
   MAIN IMAGE PREVIEW
   ===================================================== */

const mainImageInput =
    document.getElementById(
        "adminMainImage"
    );

const mainImagePreview =
    document.getElementById(
        "mainImagePreview"
    );


if (mainImageInput && mainImagePreview) {

    mainImageInput.addEventListener(
        "change",
        function () {

            /* Clear old preview */

            mainImagePreview.innerHTML = "";


            /* Get selected file */

            const file =
                this.files[0];


            /* No file selected */

            if (!file) {

                return;

            }


            /* Check image */

            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                alert(
                    "Please select an image file."
                );

                this.value = "";

                return;

            }


            /* Create FileReader */

            const reader =
                new FileReader();


            reader.onload =
                function (event) {

                    mainImagePreview.innerHTML = `

                        <div class="preview-item">

                            <img
                                src="${event.target.result}"
                                alt="Main Property Image Preview"
                            >

                            <p>
                                Main Image Preview
                            </p>

                        </div>

                    `;

                };


            reader.readAsDataURL(file);

        }
    );

}

const galleryPreview =

if (galleryInput && galleryPreview) {

            if (

            }


            /* Display every image */

            files.forEach(
                function (
                    file,

                ) {

                    /* Check image */

                    if (
                        !file.type.startsWith(
                            "image/"
                        )
                    ) {

                        return;

                    }


                    /* FileReader */

                    const reader =
                        new FileReader();


                    reader.onload =
                        function (event) {

                            const previewItem =
                                document.createElement(
                                    "div"
                                );


                            previewItem.className =
                                "gallery-preview-item";


                            previewItem.innerHTML = `

                                <img
                                    src="${event.target.result}"
                                    alt="Gallery Image ${index + 1}"
                                >

                                <p>
                                    Image ${index + 1}
                                </p>

                            `;


                            galleryPreview.appendChild(
                                previewItem
                            );

                        };


                    reader.readAsDataURL(
                        file
                    );

                }
            );

        }
    );

}

</script>

</body>

</html>
